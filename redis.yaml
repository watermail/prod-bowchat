apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: prod-bowchat
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: public.ecr.aws/bitnami/redis:7.4.2-debian-12-r11
          env:
            - name: ALLOW_EMPTY_PASSWORD
              value: "yes"
          ports:
            - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: prod-bowchat
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
